<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원가입·로그인 | 쇼핑몰</title><link rel="stylesheet" href="/styles.css"></head>

<main id="main" class="container auth-page"><div class="page-heading"><div><p class="eyebrow">계정</p><h1>회원가입 · 로그인</h1></div></div><div class="auth-grid"><section class="auth-card"><h2>로그인</h2><form id="login-form"><label for="login-email">이메일</label><input id="login-email" name="email" type="email" autocomplete="email" required><label for="login-password">비밀번호</label><input id="login-password" name="password" type="password" autocomplete="current-password" required><button class="button button-primary" type="submit">로그인</button><p id="login-status" class="status-message" aria-live="polite"></p></form></section><section class="auth-card"><h2>회원가입</h2><form id="signup-form"><label for="signup-email">이메일</label><input id="signup-email" name="email" type="email" autocomplete="email" required><label for="signup-password">비밀번호 (8자 이상)</label><input id="signup-password" name="password" type="password" minlength="8" autocomplete="new-password" required><label for="signup-name">이름</label><input id="signup-name" name="name" autocomplete="name" required><button class="button button-secondary" type="submit">회원가입</button><p id="signup-status" class="status-message" aria-live="polite"></p></form></section></div></main><footer class="site-footer"><div class="container">상품·장바구니·주문 단계 쇼핑몰</div></footer><script src="/app.js" defer></script></body></html>
